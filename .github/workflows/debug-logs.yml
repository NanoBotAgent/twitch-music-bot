name: Debug Logs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = test youtube mirrors"
        default: "probe"
      video_id:
        description: "video id to probe"
        default: "9DyWHHxzMR0"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe YouTube mirror instances
        env:
          VID: ${{ github.event.inputs.video_id }}
        run: |
          set -u
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"

          echo "### INVIDIOUS /api/v1/videos/$VID ###"
          for host in yewtu.be inv.nadeko.net invidious.f5.si iv.melmac.space invidious.privacyredirect.com; do
            out=$(curl -sS -m 8 -A "$UA" -w "|HTTP=%{http_code}" "https://$host/api/v1/videos/$VID" 2>&1 | tail -c 200)
            echo "$host -> $out"
          done

          echo ""
          echo "### PIPED /streams/$VID ###"
          for host in pipedapi.leptons.xyz pipedapi.adminforge.de api.piped.private.coffee pipedapi.reallyaweso.me pipedapi.ducks.party pipedapi.drgns.space; do
            out=$(curl -sS -m 8 -A "$UA" -w "|HTTP=%{http_code}" "https://$host/streams/$VID" 2>&1 | tail -c 200)
            echo "$host -> $out"
          done
