name: Debug Logs

on:
  workflow_dispatch:

jobs:
  ytdlp-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test yt-dlp stream extraction from datacenter IP
        run: |
          set -u
          curl -sS -L -o ytdlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x ytdlp
          ./ytdlp --version
          echo "== get stream url =="
          ./ytdlp -f "bestaudio" --no-warnings --get-url "https://www.youtube.com/watch?v=9DyWHHxzMR0" 2>&1 | head -c 400
          echo ""
          echo "== with android client fallback =="
          ./ytdlp -f "bestaudio" --extractor-args "youtube:player_client=default,android" --no-warnings --get-url "https://www.youtube.com/watch?v=9DyWHHxzMR0" 2>&1 | head -c 400
