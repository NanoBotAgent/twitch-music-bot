name: Debug Logs

on:
  workflow_dispatch:
    inputs:
      path:
        description: "WebDAV path to dump (file) or list+dump (dir ending in /)"
        default: "/admin/logs/"

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Dump backend service logs
        env:
          AD_WEBDAV_PASSWORD: ${{ secrets.ALWAYSDATA_WEBDAV_PASSWORD }}
          LOG_PATH: ${{ github.event.inputs.path }}
        run: |
          set -uo pipefail
          AUTH="twitch-bot:${AD_WEBDAV_PASSWORD}"
          BASE="https://webdav-twitch-bot.alwaysdata.net"

          if [[ "$LOG_PATH" == */ ]]; then
            code=$(curl -sS --basic --user "$AUTH" -X PROPFIND -H 'Depth: 1' \
              -o /tmp/listing.xml -w '%{http_code}' "$BASE$LOG_PATH" || true)
            echo "== LIST $LOG_PATH -> $code =="
            cat /tmp/listing.xml || true
          else
            code=$(curl -sS --basic --user "$AUTH" -o /tmp/file.out -w '%{http_code}' "$BASE$LOG_PATH" || true)
            echo "== GET $LOG_PATH -> $code =="
            tail -n 300 /tmp/file.out || true
          fi
