name: Weather Forecast Video

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC

permissions:
  contents: read

jobs:
  generate-video:
    name: Generate Weather Video
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6 libxrender-dev libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy

      - name: Generate weather visualization video
        run: |
          cd scripts
          python weather_video.py

      - name: Verify video output
        run: |
          ls -la scripts/weather_forecast.mp4
          file scripts/weather_forecast.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-forecast-video
          path: scripts/weather_forecast.mp4
          retention-days: 7
          compression-level: 6

      - name: Upload to paste.rs as fallback
        if: always()
        run: |
          if [ -f scripts/weather_forecast.mp4 ]; then
            URL=$(curl --data-binary @scripts/weather_forecast.mp4 https://paste.rs/ 2>/dev/null || echo "upload failed")
            echo "paste_rs_url=$URL" >> $GITHUB_OUTPUT
            echo "Video also available at: $URL"
          fi
        id: paste_upload

      - name: Summary
        run: |
          echo "## Weather Forecast Video Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Locations**: Grandvoir (Belgium) & Vianden (Luxembourg)" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration**: 7 days animated" >> $GITHUB_STEP_SUMMARY
          echo "- **Format**: MP4 (H.264), 1920x1080" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: \`weather-forecast-video\` (7-day retention)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.paste_upload.outputs.paste_rs_url }}" != "upload failed" ]; then
            echo "- **Fallback URL**: ${{ steps.paste_upload.outputs.paste_rs_url }}" >> $GITHUB_STEP_SUMMARY
          fi