[package]
name = "twitch-music-bot"
version = "0.1.0"
edition = "2021"
description = "Twitch music request bot with browser-source overlay"
license = "MIT"

[dependencies]
twitch-music-shared = { path = "../shared" }

# Web framework
axum = { version = "0.7", features = ["ws", "json", "form"] }
tower = { version = "0.4", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }

# Async runtime
tokio = { version = "1.38", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# Twitch
twitch-irc = "5.0"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip"], default-features = false }

# Config & Secrets
config = { version = "0.14", features = ["toml"] }
secrecy = "0.10"

# Auth / Crypto
jsonwebtoken = "9.2"
aes-gcm = "0.10"
rand = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.7", features = ["v4", "serde"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "ansi"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
sysinfo = "0.30"

# Error handling
anyhow = "1.0"

# Utilities
regex = "1"
async-trait = "0.1"
base64 = "0.22"
url = "2.5"
urlencoding = "2.1"
