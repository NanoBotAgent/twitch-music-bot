[server]
host = "[::]"
port = 8380
workers = 2

[database]
max_connections = 5

[twitch]
redirect_uri = "https://twitch-bot.alwaysdata.net/auth/twitch/callback"

[spotify]
redirect_uri = "https://twitch-bot.alwaysdata.net/auth/spotify/callback"

[security]
frontend_url = "https://twitch-music-bot.vercel.app"
cors_allowed_origins = ["https://twitch-music-bot.vercel.app", "https://twitch-music-bot-nanobotagents-projects.vercel.app", "https://twitch-bot.alwaysdata.net", "https://*.vercel.app"]

[logging]
level = "info"

[metrics]
enabled = false
