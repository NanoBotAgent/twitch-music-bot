<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Music Bot Overlay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #020617;
      --fg: #f8fafc;
      --primary: #22d3ee;
      --primary-glow: #06b6d4;
      --muted: #1e293b;
      --border: #334155;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }

    .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(20px); border: 1px solid var(--border); }
    .glow { box-shadow: 0 0 30px rgba(6, 182, 212, 0.3); }

    @keyframes pulse-glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes slide-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes progress { from { width: 0%; } to { width: 100%; } }

    .animate-slide-up { animation: slide-up 0.5s ease-out forwards; }
    .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }

    .progress-bar { height: 4px; background: linear-gradient(90deg, var(--primary), var(--primary-glow)); border-radius: 2px; transform-origin: left; }

    .volume-knob { width: 60px; height: 60px; border-radius: 50%; background: conic-gradient(from 0deg, var(--primary), var(--primary-glow), var(--primary)); display: flex; align-items: center; justify-content: center; cursor: grab; }
    .volume-knob::before { content: ''; width: 44px; height: 44px; border-radius: 50%; background: var(--muted); }

    .song-card { transition: all 0.3s ease; }
    .song-card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

    .now-playing { animation: slide-up 0.6s ease-out; }
    .queue-item { animation: slide-up 0.4s ease-out; animation-fill-mode: both; }
    .queue-item:nth-child(1) { animation-delay: 0.1s; }
    .queue-item:nth-child(2) { animation-delay: 0.2s; }
    .queue-item:nth-child(3) { animation-delay: 0.3s; }
    .queue-item:nth-child(4) { animation-delay: 0.4s; }
    .queue-item:nth-child(5) { animation-delay: 0.5s; }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); animation: pulse-glow 1.5s ease-in-out infinite; }
    .status-dot.paused { background: #f59e0b; animation: none; }
    .status-dot.error { background: #ef4444; animation: none; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--muted); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
  </style>
</head>
<body>
  <div id="app" class="h-screen w-screen flex flex-col">
    <!-- Connection Status -->
    <div id="connection-status" class="fixed top-2 right-2 z-50 flex items-center gap-2 px-3 py-1.5 glass rounded-full text-xs font-medium hidden">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Connecting...</span>
    </div>

    <!-- Now Playing -->
    <div id="now-playing" class="flex-1 flex flex-col items-center justify-center px-4 py-6 now-playing hidden">
      <div class="w-full max-w-2xl">
        <!-- Song Info Card -->
        <div class="glass rounded-2xl p-6 song-card relative overflow-hidden glow">
          <!-- Background Art -->
          <div id="bg-art" class="absolute inset-0 -z-10 opacity-20" style="background-size: cover; background-position: center; filter: blur(40px);"></div>

          <div class="flex flex-col sm:flex-row gap-6">
            <!-- Album Art -->
            <div class="relative w-48 h-48 sm:w-56 sm:h-56 flex-shrink-0 rounded-xl overflow-hidden shadow-2xl">
              <img id="album-art" src="" alt="" class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
              <div id="playing-indicator" class="absolute bottom-3 left-3 flex items-center gap-1.5 text-white/90 font-medium">
                <span class="status-dot"></span>
                <span class="text-sm">LIVE</span>
              </div>
            </div>

            <!-- Song Details -->
            <div class="flex-1 min-w-0 flex flex-col justify-center">
              <div class="flex items-center gap-3 mb-2">
                <span id="source-badge" class="px-2.5 py-1 rounded-full text-xs font-semibold uppercase tracking-wide"></span>
                <span id="explicit-badge" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-red-500/20 text-red-400 hidden">EXPLICIT</span>
              </div>
              <h1 id="song-title" class="text-3xl sm:text-4xl font-bold truncate mb-1">No song playing</h1>
              <p id="song-artist" class="text-lg sm:text-xl text-slate-300 truncate mb-4">Waiting for requests...</p>

              <!-- Progress Bar -->
              <div class="mb-4">
                <div class="flex justify-between text-xs text-slate-400 mb-1">
                  <span id="current-time">0:00</span>
                  <span id="total-time">0:00</span>
                </div>
                <div class="w-full h-2 bg-slate-700 rounded-full overflow-hidden">
                  <div id="progress-bar" class="progress-bar h-full" style="width: 0%; transform: scaleX(0);"></div>
                </div>
              </div>

              <!-- Requested By -->
              <div class="flex items-center gap-2 text-sm text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span id="requested-by">—</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Controls -->
        <div class="glass rounded-2xl p-4 mt-6 flex flex-col sm:flex-row items-center justify-center gap-6 w-full max-w-2xl">
          <button id="btn-prev" class="p-3 rounded-xl glass hover:bg-slate-700 transition-colors" title="Previous" disabled>
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
          </button>

          <button id="btn-play-pause" class="p-4 rounded-2xl bg-primary text-slate-950 hover:bg-primary-glow transition-all shadow-lg shadow-primary/30" title="Play/Pause">
            <svg id="play-icon" class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
            <svg id="pause-icon" class="w-8 h-8 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
          </button>

          <button id="btn-next" class="p-3 rounded-xl glass hover:bg-slate-700 transition-colors" title="Next" disabled>
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
          </button>

          <!-- Volume Knob -->
          <div class="relative">
            <div class="volume-knob" id="volume-knob" role="slider" aria-label="Volume" tabindex="0">
              <svg class="w-6 h-6 text-slate-950 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path id="vol-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
              </svg>
            </div>
            <div id="volume-tooltip" class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-2 py-1 glass rounded text-xs text-slate-300 opacity-0 pointer-events-none transition-opacity">50%</div>
          </div>

          <button id="btn-skip" class="p-3 rounded-xl glass hover:bg-red-500/20 text-red-400 hover:text-red-300 transition-colors" title="Skip">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.102 1.101"></path></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Queue Panel -->
    <div id="queue-panel" class="w-full max-w-md px-4 pb-6 queue-panel hidden">
      <div class="glass rounded-2xl overflow-hidden">
        <div class="p-4 border-b border-slate-700 flex items-center justify-between">
          <h2 class="font-semibold text-lg flex items-center gap-2">
            <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.905 1.476 3.45 3.397 3.708a12.058 12.058 0 006.603 0C18.524 22.45 20 20.905 20 19M9 19a12.058 12.058 0 016.603 0"></path></svg>
            Queue
          </h2>
          <span id="queue-count" class="px-2 py-1 text-xs font-medium bg-primary/20 text-primary rounded-full">0</span>
        </div>
        <div id="queue-list" class="max-h-96 overflow-y-auto divide-y divide-slate-700/50">
          <!-- Queue items inserted here -->
        </div>
        <div id="queue-empty" class="p-8 text-center text-slate-500 hidden">
          <svg class="w-12 h-12 mx-auto mb-3 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.905 1.476 3.45 3.397 3.708a12.058 12.058 0 006.603 0C18.524 22.45 20 20.905 20 19M9 19a12.058 12.058 0 016.603 0"></path></svg>
          <p>Queue is empty</p>
        </div>
      </div>
    </div>

    <!-- Audio Element -->
    <audio id="audio-player" crossorigin="anonymous" preload="metadata"></audio>
  </div>

  <script type="module">
    // Configuration
    const STREAMER_ID = new URLSearchParams(window.location.search).get('streamer') || '';
    const WS_URL = (window.location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + window.location.host + '/ws/overlay/' + STREAMER_ID;

    // State
    let ws = null;
    let audio = document.getElementById('audio-player');
    let currentSong = null;
    let queue = [];
    let volume = 0.5;
    let isPlaying = false;
    let progressInterval = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT_ATTEMPTS = 10;
    const RECONNECT_DELAY = 5000;

    // DOM Elements
    const elements = {
      connectionStatus: document.getElementById('connection-status'),
      statusDot: document.getElementById('status-dot'),
      statusText: document.getElementById('status-text'),
      nowPlaying: document.getElementById('now-playing'),
      queuePanel: document.getElementById('queue-panel'),
      bgArt: document.getElementById('bg-art'),
      albumArt: document.getElementById('album-art'),
      sourceBadge: document.getElementById('source-badge'),
      explicitBadge: document.getElementById('explicit-badge'),
      songTitle: document.getElementById('song-title'),
      songArtist: document.getElementById('song-artist'),
      currentTime: document.getElementById('current-time'),
      totalTime: document.getElementById('total-time'),
      progressBar: document.getElementById('progress-bar'),
      requestedBy: document.getElementById('requested-by'),
      playingIndicator: document.getElementById('playing-indicator'),
      playIcon: document.getElementById('play-icon'),
      pauseIcon: document.getElementById('pause-icon'),
      volumeKnob: document.getElementById('volume-knob'),
      volumeTooltip: document.getElementById('volume-tooltip'),
      queueList: document.getElementById('queue-list'),
      queueCount: document.getElementById('queue-count'),
      queueEmpty: document.getElementById('queue-empty'),
      btnPlayPause: document.getElementById('btn-play-pause'),
      btnPrev: document.getElementById('btn-prev'),
      btnNext: document.getElementById('btn-next'),
      btnSkip: document.getElementById('btn-skip'),
    };

    // Source styling
    const sourceStyles = {
      youtube: { bg: 'bg-red-500/20', text: 'text-red-400', label: 'YOUTUBE', icon: '▶' },
      spotify: { bg: 'bg-green-500/20', text: 'text-green-400', label: 'SPOTIFY', icon: '♪' },
      soundcloud: { bg: 'bg-orange-500/20', text: 'text-orange-400', label: 'SOUNDCLOUD', icon: '☁' },
    };

    // Initialize
    function init() {
      connectWebSocket();
      setupAudioEvents();
      setupVolumeKnob();
      setupControls();
      showConnectionStatus('Connecting...', 'connecting');
    }

    // WebSocket Connection
    function connectWebSocket() {
      if (!STREAMER_ID) {
        showConnectionStatus('No streamer ID provided', 'error');
        return;
      }

      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        console.log('WebSocket connected');
        reconnectAttempts = 0;
        showConnectionStatus('Connected', 'connected');
        ws.send(JSON.stringify({ type: 'ready' }));
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleMessage(msg);
        } catch (e) {
          console.error('Message parse error:', e);
        }
      };

      ws.onclose = () => {
        console.log('WebSocket disconnected');
        showConnectionStatus('Disconnected', 'disconnected');
        scheduleReconnect();
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        showConnectionStatus('Connection error', 'error');
      };
    }

    function scheduleReconnect() {
      if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
        showConnectionStatus('Max reconnect attempts reached', 'error');
        return;
      }
      reconnectAttempts++;
      showConnectionStatus(`Reconnecting... (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`, 'connecting');
      setTimeout(connectWebSocket, RECONNECT_DELAY);
    }

    function showConnectionStatus(text, type) {
      elements.statusText.textContent = text;
      elements.connectionStatus.classList.remove('hidden');
      elements.statusDot.className = 'status-dot';
      if (type === 'error') elements.statusDot.classList.add('error');
      else if (type === 'connected') elements.statusDot.classList.remove('error');
      else if (type === 'disconnected') elements.statusDot.classList.add('paused');
    }

    // Message Handler
    function handleMessage(msg) {
      switch (msg.type) {
        case 'connected':
          console.log('Overlay connection confirmed');
          break;
        case 'play':
          playSong(msg.payload);
          break;
        case 'pause':
          pauseAudio();
          break;
        case 'resume':
          resumeAudio();
          break;
        case 'stop':
          stopAudio();
          break;
        case 'skip':
          skipSong();
          break;
        case 'volume':
          setVolume(msg.payload.volume);
          break;
        case 'queue_update':
          updateQueue(msg.payload);
          break;
        case 'now_playing':
          updateNowPlaying(msg.payload);
          break;
        case 'config_update':
          updateConfig(msg.payload.config);
          break;
        case 'error':
          console.error('Overlay error:', msg.payload);
          showConnectionStatus('Error: ' + msg.payload.message, 'error');
          break;
      }
    }

    // Audio Handling
    function setupAudioEvents() {
      audio.addEventListener('loadedmetadata', () => {
        elements.totalTime.textContent = formatTime(audio.duration);
      });

      audio.addEventListener('timeupdate', () => {
        updateProgress();
      });

      audio.addEventListener('ended', () => {
        onSongEnded();
      });

      audio.addEventListener('error', (e) => {
        console.error('Audio error:', audio.error);
        showConnectionStatus('Playback error', 'error');
      });

      audio.addEventListener('waiting', () => {
        elements.statusDot.classList.add('paused');
      });

      audio.addEventListener('playing', () => {
        elements.statusDot.classList.remove('paused');
      });
    }

    function playSong(payload) {
      const { song, volume: vol, crossfade, start_time } = payload;

      currentSong = song;
      volume = vol ?? 0.5;
      audio.volume = volume;
      updateVolumeUI();

      // Set source
      if (song.stream_url) {
        audio.src = song.stream_url;
      } else {
        console.error('No stream URL for song:', song);
        return;
      }

      // Update UI
      updateNowPlayingUI(song);

      // Play
      if (start_time !== undefined) {
        audio.currentTime = start_time;
      }
      audio.play().catch(err => {
        console.error('Play failed:', err);
        showConnectionStatus('Playback failed', 'error');
      });
    }

    function pauseAudio() {
      audio.pause();
      isPlaying = false;
      updatePlayPauseButton();
    }

    function resumeAudio() {
      audio.play().catch(err => console.error('Resume failed:', err));
      isPlaying = true;
      updatePlayPauseButton();
    }

    function stopAudio() {
      audio.pause();
      audio.src = '';
      audio.load();
      currentSong = null;
      isPlaying = false;
      updatePlayPauseButton();
      elements.nowPlaying.classList.add('hidden');
      elements.queuePanel.classList.add('hidden');
    }

    function skipSong() {
      // Server handles skip, we just stop current
      audio.pause();
      audio.src = '';
      audio.load();
    }

    function onSongEnded() {
      isPlaying = false;
      updatePlayPauseButton();
      // Server will send next song via queue_update
    }

    function updateProgress() {
      if (!audio.duration) return;
      const progress = (audio.currentTime / audio.duration) * 100;
      elements.progressBar.style.transform = `scaleX(${progress / 100})`;
      elements.currentTime.textContent = formatTime(audio.currentTime);
    }

    function formatTime(seconds) {
      if (!seconds || isNaN(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // Volume Knob
    function setupVolumeKnob() {
      let isDragging = false;
      let startAngle = 0;
      let startVolume = volume;

      function getAngle(e) {
        const rect = elements.volumeKnob.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        return Math.atan2(clientY - centerY, clientX - centerX);
      }

      function angleToVolume(angle) {
        // Map -135deg to 135deg -> 0 to 1
        let deg = angle * 180 / Math.PI;
        if (deg < -135) deg += 360;
        return Math.max(0, Math.min(1, (deg + 135) / 270));
      }

      function rotateKnob(vol) {
        const deg = -135 + vol * 270;
        elements.volumeKnob.style.transform = `rotate(${deg}deg)`;
      }

      elements.volumeKnob.addEventListener('mousedown', (e) => {
        isDragging = true;
        startAngle = getAngle(e);
        startVolume = volume;
        elements.volumeTooltip.classList.remove('opacity-0');
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const angle = getAngle(e);
        const diff = angle - startAngle;
        volume = Math.max(0, Math.min(1, startVolume + diff * 2));
        audio.volume = volume;
        updateVolumeUI();
        rotateKnob(volume);
      });

      document.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          elements.volumeTooltip.classList.add('opacity-0');
          sendVolumeUpdate();
        }
      });

      // Touch support
      elements.volumeKnob.addEventListener('touchstart', (e) => {
        isDragging = true;
        startAngle = getAngle(e);
        startVolume = volume;
        elements.volumeTooltip.classList.remove('opacity-0');
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const angle = getAngle(e);
        const diff = angle - startAngle;
        volume = Math.max(0, Math.min(1, startVolume + diff * 2));
        audio.volume = volume;
        updateVolumeUI();
        rotateKnob(volume);
      }, { passive: true });

      document.addEventListener('touchend', () => {
        if (isDragging) {
          isDragging = false;
          elements.volumeTooltip.classList.add('opacity-0');
          sendVolumeUpdate();
        }
      });

      // Keyboard support
      elements.volumeKnob.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
          volume = Math.min(1, volume + 0.05);
          audio.volume = volume;
          updateVolumeUI();
          rotateKnob(volume);
          sendVolumeUpdate();
        } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
          volume = Math.max(0, volume - 0.05);
          audio.volume = volume;
          updateVolumeUI();
          rotateKnob(volume);
          sendVolumeUpdate();
        }
      });

      // Initial rotation
      rotateKnob(volume);
    }

    function updateVolumeUI() {
      elements.volumeTooltip.textContent = `${Math.round(volume * 100)}%`;
      updateVolumeIcon();
    }

    function updateVolumeIcon() {
      const icon = elements.volumeKnob.querySelector('#vol-icon');
      if (volume === 0) {
        icon.setAttribute('d', 'M9 9h6v6H9z');
      } else if (volume < 0.5) {
        icon.setAttribute('d', 'M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z');
      } else {
        icon.setAttribute('d', 'M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z');
      }
    }

    function sendVolumeUpdate() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'volume', payload: { volume } }));
      }
    }

    // Controls
    function setupControls() {
      elements.btnPlayPause.addEventListener('click', () => {
        if (audio.paused) {
          audio.play().catch(err => console.error('Play failed:', err));
        } else {
          audio.pause();
        }
        isPlaying = !audio.paused;
        updatePlayPauseButton();
      });

      elements.btnSkip.addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'skip' }));
        }
      });
    }

    function updatePlayPauseButton() {
      if (audio.paused) {
        elements.playIcon.classList.remove('hidden');
        elements.pauseIcon.classList.add('hidden');
      } else {
        elements.playIcon.classList.add('hidden');
        elements.pauseIcon.classList.remove('hidden');
      }
    }

    // UI Updates
    function updateNowPlayingUI(song) {
      elements.nowPlaying.classList.remove('hidden');
      elements.queuePanel.classList.remove('hidden');

      // Album art
      if (song.thumbnail_url) {
        elements.albumArt.src = song.thumbnail_url;
        elements.bgArt.style.backgroundImage = `url(${song.thumbnail_url})`;
      } else {
        elements.albumArt.src = '';
        elements.bgArt.style.backgroundImage = '';
      }

      // Source badge
      const style = sourceStyles[song.source] || sourceStyles.youtube;
      elements.sourceBadge.className = `px-2.5 py-1 rounded-full text-xs font-semibold uppercase tracking-wide ${style.bg} ${style.text}`;
      elements.sourceBadge.textContent = style.label;

      // Explicit badge
      if (song.explicit) {
        elements.explicitBadge.classList.remove('hidden');
      } else {
        elements.explicitBadge.classList.add('hidden');
      }

      // Title & Artist
      elements.songTitle.textContent = song.title || 'Unknown Title';
      elements.songArtist.textContent = song.artist || 'Unknown Artist';
      elements.totalTime.textContent = formatTime(song.duration_seconds);

      // Requested by
      // This would come from queue_update
    }

    function updateNowPlaying(payload) {
      if (payload.song) {
        updateNowPlayingUI(payload.song);
        if (payload.song.requested_by) {
          elements.requestedBy.textContent = `Requested by ${payload.song.requested_by.display_name}`;
        }
      } else {
        elements.nowPlaying.classList.add('hidden');
      }
    }

    function updateQueue(payload) {
      queue = payload.queue || [];
      currentSong = payload.current || null;

      elements.queueCount.textContent = queue.length;
      elements.queueList.innerHTML = '';

      if (queue.length === 0) {
        elements.queueEmpty.classList.remove('hidden');
      } else {
        elements.queueEmpty.classList.add('hidden');
        queue.forEach((item, index) => {
          const el = createQueueItem(item, index);
          elements.queueList.appendChild(el);
        });
      }
    }

    function createQueueItem(item, index) {
      const div = document.createElement('div');
      div.className = 'queue-item p-3 flex items-center gap-3 hover:bg-slate-700/50 transition-colors';
      div.innerHTML = `
        <span class="w-6 text-center text-slate-400 font-mono text-sm">${index + 1}</span>
        <div class="w-10 h-10 rounded-lg overflow-hidden flex-shrink-0 bg-slate-800">
          ${item.song.thumbnail_url
            ? `<img src="${item.song.thumbnail_url}" alt="" class="w-full h-full object-cover">`
            : `<div class="w-full h-full flex items-center justify-center text-xl">🎵</div>`
          }
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-medium truncate">${item.song.title}</p>
          <p class="text-xs text-slate-400 truncate">${item.song.artist} • @${item.requested_by.display_name}</p>
        </div>
        <span class="text-xs text-slate-500">${formatTime(item.song.duration_seconds)}</span>
      `;
      return div;
    }

    function updateConfig(config) {
      // Apply config changes if needed
      console.log('Config updated:', config);
    }

    // Start
    init();
  </script>
</body>
</html>
