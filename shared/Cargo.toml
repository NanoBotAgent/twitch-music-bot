[package]
name = "twitch-music-shared"
version = "0.1.0"
edition = "2021"
description = "Shared types for Twitch music bot"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "v7", "serde", "fast-rng"] }
thiserror = "1.0"